version: 2

models:
  - name: stg_customers
    description: "Cleaned, renamed customer records from the raw_customers seed."
    columns:
      - name: customer_id
        description: "Primary key for a customer."
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address."

  - name: stg_orders
    description: "Cleaned, renamed order records from the raw_orders seed."
    columns:
      - name: order_id
        description: "Primary key for an order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_customers."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        description: "Order status."
        tests:
          - accepted_values:
              values: ['completed', 'pending', 'cancelled']
